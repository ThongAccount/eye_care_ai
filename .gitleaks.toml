# Shared gitleaks config for eye_care_ai (auto-discovered from repo root).
# Usage: gitleaks detect --source . --config .gitleaks.toml
# Covers nvapi- keys, which GitHub push protection does not (personal repos
# cannot define custom patterns server-side, so this file is the shareable
# definition; scripts/githooks/pre-push is the zero-dependency enforcer).
title = "eye_care_ai secret guard"

[extend]
useDefault = true

[[rules]]
id = "nvidia-nim-api-key"
description = "NVIDIA NIM API key (nvapi-...). Rotate immediately if found outside a vault."
regex = '''nvapi-[A-Za-z0-9_.-]{20,}'''
tags = ["api-key", "nvidia"]
