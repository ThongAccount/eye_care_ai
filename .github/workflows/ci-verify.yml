name: CI verify

# Gate analyze + test cho các nhánh tính năng — KHÔNG cắt release.
#
# build-apk.yml chỉ chạy khi push vào main (hoặc dispatch thủ công) và nó
# PUBLISH GitHub Release + APK/AAB, nên dùng nó để kiểm tra một nhánh tính
# năng sẽ phát hành bản build cho người dùng thật. Workflow này chỉ chạy
# hai gate mà CI thật dùng để chặn code hỏng:
#
#   flutter analyze --no-fatal-warnings --no-fatal-infos
#   flutter test
#
# Cùng cache Flutter/pub-cache với build-apk.yml để lần chạy đầu không bị
# chậm vì tải SDK.
on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test
