name: Backup Keystore

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret configured — nothing to back up."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Encrypt with GPG (AES256, passphrase from secret)
        env:
          RECOVERY_PASSPHRASE: ${{ secrets.RECOVERY_PASSPHRASE }}
        run: |
          if [ ! -s release-keystore.jks ]; then
            echo "No keystore file produced — skip."
            exit 0
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$RECOVERY_PASSPHRASE" \
            -o release-keystore.jks.gpg release-keystore.jks
          echo "Encrypted. Size:" && ls -la release-keystore.jks.gpg

      - name: Verify decryption round-trip
        env:
          RECOVERY_PASSPHRASE: ${{ secrets.RECOVERY_PASSPHRASE }}
        run: |
          if [ ! -s release-keystore.jks.gpg ]; then exit 0; fi
          gpg --batch --yes --decrypt \
            --passphrase "$RECOVERY_PASSPHRASE" \
            -o /tmp/verify.jks release-keystore.jks.gpg
          cmp release-keystore.jks /tmp/verify.jks && echo "ROUND-TRIP OK" || { echo "ROUND-TRIP MISMATCH"; exit 1; }

      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-encrypted
          path: release-keystore.jks.gpg
          if-no-files-found: error
          retention-days: 7
